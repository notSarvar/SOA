syntax = "proto3";

package event;

option go_package = "github.com/sarvar/PromoService/proto/event";

import "google/protobuf/timestamp.proto";

service EventService {
  rpc TrackPromoView(TrackPromoViewRequest) returns (TrackPromoViewResponse);
  rpc TrackPromoClick(TrackPromoClickRequest) returns (TrackPromoClickResponse);
  rpc TrackPromoComment(TrackPromoCommentRequest) returns (TrackPromoCommentResponse);
  rpc GetPromoComments(GetPromoCommentsRequest) returns (GetPromoCommentsResponse);
  rpc TrackClientRegistration(TrackClientRegistrationRequest) returns (TrackClientRegistrationResponse);
  rpc TrackPromoCreated(TrackPromoCreatedRequest) returns (TrackPromoCreatedResponse);
  rpc TrackPromoUpdated(TrackPromoUpdatedRequest) returns (TrackPromoUpdatedResponse);
  rpc TrackPromoDeleted(TrackPromoDeletedRequest) returns (TrackPromoDeletedResponse);
  rpc TrackUserProfileUpdate(TrackUserProfileUpdateRequest) returns (TrackUserProfileUpdateResponse);
}

message TrackPromoViewRequest {
  string client_id = 1;
  string promo_id = 2;
  google.protobuf.Timestamp viewed_at = 3;
}

message TrackPromoViewResponse {
  bool success = 1;
}

message TrackPromoClickRequest {
  string client_id = 1;
  string promo_id = 2;
  google.protobuf.Timestamp clicked_at = 3;
}

message TrackPromoClickResponse {
  bool success = 1;
}

message TrackPromoCommentRequest {
  string client_id = 1;
  string promo_id = 2;
  string comment_text = 3;
  google.protobuf.Timestamp commented_at = 4;
}

message TrackPromoCommentResponse {
  bool success = 1;
}

message GetPromoCommentsRequest {
  string promo_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message GetPromoCommentsResponse {
  repeated PromoComment comments = 1;
  int32 total_count = 2;
}

message PromoComment {
  string id = 1;
  string client_id = 2;
  string promo_id = 3;
  string comment_text = 4;
  google.protobuf.Timestamp commented_at = 5;
}

message TrackClientRegistrationRequest {
  string client_id = 1;
  string email = 2;
  string name = 3;
  google.protobuf.Timestamp registered_at = 4;
}

message TrackClientRegistrationResponse {
  bool success = 1;
}

message TrackPromoCreatedRequest {
  string promo_id = 1;
  string creator_id = 2;
  string code = 3;
  double discount_amount = 4;
  google.protobuf.Timestamp created_at = 5;
}

message TrackPromoCreatedResponse {
  bool success = 1;
}

message TrackPromoUpdatedRequest {
  string promo_id = 1;
  string updated_by = 2;
  repeated string updated_fields = 3;
  google.protobuf.Timestamp updated_at = 4;
}

message TrackPromoUpdatedResponse {
  bool success = 1;
}

message TrackPromoDeletedRequest {
  string promo_id = 1;
  string deleted_by = 2;
  google.protobuf.Timestamp deleted_at = 3;
}

message TrackPromoDeletedResponse {
  bool success = 1;
}

message TrackUserProfileUpdateRequest {
  string user_id = 1;
  repeated string updated_fields = 2;
  google.protobuf.Timestamp updated_at = 3;
}

message TrackUserProfileUpdateResponse {
  bool success = 1;
} 