syntax = "proto3";

package user;

option go_package = "promoservice/proto/user";

import "google/protobuf/timestamp.proto";

service UserService {
  rpc Register(RegisterRequest) returns (RegisterResponse) {}
  rpc Login(LoginRequest) returns (LoginResponse) {}
  rpc GetProfile(GetProfileRequest) returns (GetProfileResponse) {}
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse) {}
  rpc TrackUserActivity(TrackUserActivityRequest) returns (TrackUserActivityResponse) {}
  rpc GetUserActivity(GetUserActivityRequest) returns (GetUserActivityResponse) {}
}

enum UserRole {
  UNKNOWN = 0;
  CUSTOMER = 1;
  BUSINESS = 2;
}

message User {
  string id = 1;
  string email = 2;
  string name = 3;
  UserRole role = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message RegisterRequest {
  string email = 1;
  string password = 2;
  string name = 3;
  UserRole role = 4;
}

message RegisterResponse {
  User user = 1;
  string token = 2;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  User user = 1;
  string token = 2;
}

message GetProfileRequest {
  string id = 1;
}

message GetProfileResponse {
  User user = 1;
}

message UpdateProfileRequest {
  string id = 1;
  string name = 2;
  string email = 3;
}

message UpdateProfileResponse {
  User user = 1;
}

message UserActivity {
  string id = 1;
  string user_id = 2;
  string activity_type = 3;
  string activity_details = 4;
  google.protobuf.Timestamp created_at = 5;
}

message TrackUserActivityRequest {
  string user_id = 1;
  string activity_type = 2;
  string activity_details = 3;
}

message TrackUserActivityResponse {
  bool success = 1;
}

message GetUserActivityRequest {
  string user_id = 1;
  int32 page = 2;
  int32 page_size = 3;
  string activity_type = 4;
  google.protobuf.Timestamp from_date = 5;
  google.protobuf.Timestamp to_date = 6;
}

message GetUserActivityResponse {
  repeated UserActivity activities = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
} 