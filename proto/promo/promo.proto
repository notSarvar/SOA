syntax = "proto3";

package promo;

option go_package = "promoservice/proto/promo";

import "google/protobuf/timestamp.proto";

service PromoService {
  rpc CreatePromo(CreatePromoRequest) returns (CreatePromoResponse);
  rpc DeletePromo(DeletePromoRequest) returns (DeletePromoResponse);
  rpc UpdatePromo(UpdatePromoRequest) returns (UpdatePromoResponse);
  rpc GetPromo(GetPromoRequest) returns (GetPromoResponse);
  rpc ListPromos(ListPromosRequest) returns (ListPromosResponse);
  rpc AddComment(AddCommentRequest) returns (AddCommentResponse);
  rpc GetComments(GetCommentsRequest) returns (GetCommentsResponse);
  rpc TrackPromoView(TrackPromoViewRequest) returns (TrackPromoViewResponse);
  rpc TrackPromoClick(TrackPromoClickRequest) returns (TrackPromoClickResponse);
  rpc TrackPromoLike(TrackPromoLikeRequest) returns (TrackPromoLikeResponse);
}

enum UserRole {
  UNKNOWN = 0;
  CUSTOMER = 1;
  BUSINESS = 2;
}

message Promo {
  string id = 1;
  string name = 2;
  string description = 3;
  string creator_id = 4;
  double discount_amount = 5;
  string code = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
  bool is_active = 9;
  google.protobuf.Timestamp valid_until = 10;
  int32 max_uses = 11;
  int32 current_uses = 12;
}

message PromoComment {
  string id = 1;
  string promo_id = 2;
  string client_id = 3;
  string comment_text = 4;
  google.protobuf.Timestamp created_at = 5;
  google.protobuf.Timestamp updated_at = 6;
}

message CreatePromoRequest {
  string name = 1;
  string description = 2;
  double discount_amount = 3;
  string code = 4;
  google.protobuf.Timestamp valid_until = 5;
  int32 max_uses = 6;
}

message CreatePromoResponse {
  Promo promo = 1;
}

message DeletePromoRequest {
  string id = 1;
}

message DeletePromoResponse {}

message UpdatePromoRequest {
  string id = 1;
  string name = 2;
  string description = 3;
  double discount_amount = 4;
  string code = 5;
  google.protobuf.Timestamp valid_until = 6;
  int32 max_uses = 7;
  bool is_active = 8;
}

message UpdatePromoResponse {
  Promo promo = 1;
}

message GetPromoRequest {
  string id = 1;
}

message GetPromoResponse {
  Promo promo = 1;
}

message ListPromosRequest {
  int32 page = 1;
  int32 page_size = 2;
  string creator_id = 3;
  bool only_active = 4;
}

message ListPromosResponse {
  repeated Promo promos = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message AddCommentRequest {
  string promo_id = 1;
  string comment_text = 2;
}

message AddCommentResponse {
  PromoComment comment = 1;
}

message GetCommentsRequest {
  string promo_id = 1;
  int32 page = 2;
  int32 page_size = 3;
}

message GetCommentsResponse {
  repeated PromoComment comments = 1;
  int32 total = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message TrackPromoViewRequest {
  string promo_id = 1;
  string user_id = 2;
  google.protobuf.Timestamp viewed_at = 3;
}

message TrackPromoViewResponse {
  bool success = 1;
}

message TrackPromoClickRequest {
  string promo_id = 1;
  string user_id = 2;
  google.protobuf.Timestamp clicked_at = 3;
}

message TrackPromoClickResponse {
  bool success = 1;
}

message TrackPromoLikeRequest {
  string promo_id = 1;
  string user_id = 2;
  google.protobuf.Timestamp liked_at = 3;
}

message TrackPromoLikeResponse {
  bool success = 1;
} 