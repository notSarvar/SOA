version: '3.8'

services:
  api-gateway:
    build:
      context: .
      dockerfile: ./api-gateway/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - USER_SERVICE_ADDRESS=user-service:50051
      - JWT_SECRET=your-secret-key
      - PORT=8080
    depends_on:
      user-service:
        condition: service_started

  user-service:
    build:
      context: .
      dockerfile: ./user-service/Dockerfile
    ports:
      - "50051:50051"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/promoservice?sslmode=disable
      - JWT_SECRET=your-secret-key
      - GRPC_PORT=50051
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=promoservice
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: 